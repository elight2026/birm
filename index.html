    <meta charset="UTF-8" />

  <body>
    <div id="root"></div>

    <!-- GitHub Pages Root Redirect Fallback: Only triggers when uncompiled repo root is served -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
          var isRawRoot = !document.querySelector('script[src*="assets/index"]');
          var p = window.location.pathname.replace(/\/+$/, '');
          if (isRawRoot && !p.endsWith('/docs')) {
            window.location.replace(p + '/docs/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
