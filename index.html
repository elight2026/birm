    <!-- GitHub Pages SPA Routing & Subpath Redirect Fallback -->
    <script id="gh-pages-redirect">
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
          var p = window.location.pathname.replace(/\/+$/, '');
          // If accessing repo root without /docs (e.g. https://elight2026.github.io/birm)
          if (!p.endsWith('/docs') && !p.includes('/docs/')) {
            var target = (p ? p : '') + '/docs/' + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        }
      })();
    </script>
